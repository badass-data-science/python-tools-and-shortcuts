[project]
name = "python-tools-and-shortcuts"
version = "0.1.0"
description = "Reusable Python utilities for AI, econometrics, databases, math, NLP, and more"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "yfinance>=0.2.40",
    "scikit-fuzzy>=0.4.2",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "statsmodels>=0.14",
    "nltk>=3.8",
    "neo4j>=5.0",
    "influxdb-client>=1.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python_tools_and_shortcuts"]
